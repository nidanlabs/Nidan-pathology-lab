name: Legacy SENAITE Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  senaite-buildout:
    name: SENAITE/Plone legacy buildout
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install buildout
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools==65.7.0" "wheel==0.38.4"
          python -m pip install "zc.buildout==3.0.1"
      - name: Build SENAITE environment
        run: buildout -c buildout.cfg
      - name: Verify instance script
        run: test -x bin/instance
