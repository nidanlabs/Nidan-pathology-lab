name: NIDAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  domain-tests:
    name: Domain tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run NIDAN tests
        env:
          PYTHONPATH: custom/nidan.lims/src
        run: pytest -q custom/nidan.lims/src/nidan/lims/tests

  package-build:
    name: Package build
    runs-on: ubuntu-latest
    needs: domain-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build NIDAN package
        working-directory: custom/nidan.lims
        run: python -m build
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nidan-lims-package
          path: custom/nidan.lims/dist/*
